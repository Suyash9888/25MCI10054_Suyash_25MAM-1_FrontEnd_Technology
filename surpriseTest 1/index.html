<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Smart To-Do Manager</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Smart To-Do Manager </h1>

        <div class="row justify-content-center ">
            <div class="col-md-8">
                <div class="border-3 border-dark border-bottom  pt-3 pb-3  ">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="taskInput" class="form-control" placeholder="Task Name" required>
                    </div>
                    <div class="col-md-2">
                        <select id="prioritySelect" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="date" id="deadlineInput" class="form-control" name="" required>
                    </div>
                    <div class="col-md-3">
                        <button type="button" id="addTaskBtn" class="btn btn-primary w-100">Add Task</button>
                    </div>
                </div>
                </div>

                <input type="text" id="searchInput" class="form-control  mt-4 " placeholder="Search tasks...">

                <div class="d-flex justify-content-between border-3 border-dark border-bottom mb-3 pt-4 pb-4">
                    <div>
                        <button id="filterAll" class="btn btn-outline-secondary me-2">All</button>
                        <button id="filterCompleted" class="btn btn-outline-success me-2">Completed</button>
                        <button id="filterPending" class="btn btn-outline-warning">Pending</button>
                    </div>
                    <div>
                        <select id="sortSelect" class="form-select">
                            <option value="priority">Priority (High → Low)</option>
                            <option value="deadline">Deadline (Nearest first)</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title" id="totalTasks">0</h5>
                                <p class="card-text">Total Tasks</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title" id="completedTasks">0</h5>
                                <p class="card-text">Completed Tasks</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title" id="pendingTasks">0</h5>
                                <p class="card-text">Pending Tasks</p>
                            </div>
                        </div>
                    </div>
                </div>

                <h2 class="text-center mb-4">Tasks</h2>
                 <div id="taskList" class="row">
                    <!-- Tasks will be added here -->
                </div>
            </div>
        </div>
    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
